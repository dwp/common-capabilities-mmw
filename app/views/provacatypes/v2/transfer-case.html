{% extends "layouts/mmw-1.html" %}

{% set pageName="Home" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <div class="govuk-form-group">
      <fieldset class="govuk-fieldset" aria-describedby="contact-hint">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
          <h1 class="govuk-fieldset__heading">
            Who do you need to handover this case to?
          </h1>
        </legend>
        <div id="contact-hint" class="govuk-hint">
          Select one option
        </div>
        <div class="govuk-radios" data-module="govuk-radios">
          <div class="govuk-radios__item">
            <input class="govuk-radios__input" id="contact" name="contact" type="radio" value="email" data-aria-controls="conditional-contact">
            <label class="govuk-label govuk-radios__label" for="contact">
              Someone in my team
            </label>
          </div>
          <div class="govuk-radios__conditional govuk-radios__conditional--hidden" id="conditional-contact">
            <div class="govuk-form-group">
              <label class="govuk-label" for="team-member">
                Team member
              </label>
              
              <select class="govuk-select" id="team-member" name="team-member" aria-describedby="teams list">
                <option value="choose" selected>Choose team member</option>
                <option value="eastmidlands">East Midlands</option>
                <option value="eastofengland">East of England</option>
                <option value="london">London</option>
                <option value="northeast">North East</option>
                <option value="northwest">North West</option>
                <option value="southeast">South East</option>
                <option value="southwest">South West</option>
                <option value="westmidlands">West Midlands</option>
                <option value="yorkshire">Yorkshire and the Humber</option>
              </select>
            </div>
          </div>
          <div class="govuk-radios__item">
            <input class="govuk-radios__input" id="contact-2" name="contact" type="radio" value="phone" data-aria-controls="conditional-contact-2">
            <label class="govuk-label govuk-radios__label" for="contact-2">
              Another  workstream
            </label>
          </div>
          <div class="govuk-radios__conditional govuk-radios__conditional--hidden" id="conditional-contact-2">
            <div class="govuk-form-group">
              <label class="govuk-label" for="team">
                Select  workstream
              </label>
              <select class="govuk-select" id="team" name="team" aria-describedby="teams list">
                <option value="choose" selected>Choose handover team</option>
                <option value="eastmidlands">East Midlands</option>
                <option value="eastofengland">East of England</option>
                <option value="london">London</option>
                <option value="northeast">North East</option>
                <option value="northwest">North West</option>
                <option value="southeast">South East</option>
                <option value="southwest">South West</option>
                <option value="westmidlands">West Midlands</option>
                <option value="yorkshire">Yorkshire and the Humber</option>
              </select>
            </div>
          </div>
          <div class="govuk-radios__item">
            <input class="govuk-radios__input" id="contact-3" name="contact" type="radio" value="text" data-aria-controls="conditional-contact-3">
            <label class="govuk-label govuk-radios__label" for="contact-3">
              Return to my teams work queue
            </label>
          </div>
          <div class="govuk-radios__conditional govuk-radios__conditional--hidden" id="conditional-contact-3">
            <div class="govuk-form-group">
              <label class="govuk-label" for="contact-by-text">
                Mobile phone number
              </label>
              <input class="govuk-input govuk-!-width-one-third" id="contact-by-text" name="contactByText" type="tel" autocomplete="tel">
            </div>
          </div>
          <div class="govuk-radios__item">
            <input class="govuk-radios__input" id="contact-3" name="contact" type="radio" value="text" data-aria-controls="conditional-contact-4">
            <label class="govuk-label govuk-radios__label" for="contact-3">
              Handover to external team or function
            </label>
          </div>
          <div class="govuk-radios__conditional govuk-radios__conditional--hidden" id="conditional-contact-4">
            <div class="govuk-form-group">
              <label class="govuk-label" for="contact-by-text">
                Mobile phone number
              </label>
              <input class="govuk-input govuk-!-width-one-third" id="contact-by-text" name="contactByText" type="tel" autocomplete="tel">
            </div>
          </div>
         
        </div>
      </fieldset>
    </div>
    <div class="govuk-button-group govuk-!-static-padding-top-5">
      <a type="submit" class="govuk-button" href="create-a-case/add-customer">
        Continue
      </a>
      <a type="submit" class="govuk-button govuk-button--secondary" href="">
        Cancel
      </a>
    </div>
  </div>
</div>

{% endblock %}
