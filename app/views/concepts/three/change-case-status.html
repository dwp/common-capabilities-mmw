{% extends "layouts/mmw-concept-1.html" %}

{% set pageName="Change case status" %}

{% block content %}

<div class="govuk-grid-row">

  <div class="govuk-grid-column-full">
    <h1 class="govuk-heading-l">
      Change status
    </h1>
    <div class="govuk-form-group">
      <div class="govuk-form-group">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--s">
            Select case status
          </legend>
          <div class="govuk-radios" data-module="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="whereDoYouLive" name="whereDoYouLive" type="radio" value="england">
              <label class="govuk-label govuk-radios__label" for="whereDoYouLive">
                Urgent
              </label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="whereDoYouLive" name="whereDoYouLive" type="radio" value="england">
              <label class="govuk-label govuk-radios__label" for="whereDoYouLive">
                Paused
              </label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="whereDoYouLive-2" name="whereDoYouLive" type="radio"
                value="scotland">
              <label class="govuk-label govuk-radios__label" for="whereDoYouLive-2">
                Review
              </label>
            </div>

          </div>
        </fieldset>
      </div>

    </div>
    <div class="">
      <a href="case-details" class="govuk-button " data-module="govuk-button" data-govuk-button-init="">
        Change status
      </a>
      <a href="case-details" class="govuk-button govuk-button--secondary" data-module="govuk-button"
        data-govuk-button-init="">
        Cancel
      </a>
    </div>




    {% endblock %}
