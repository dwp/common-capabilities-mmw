{% extends "layouts/mmw-concept.html" %}

{% set pageName="Home" %}

{% block content %}

<div class="govuk-grid-row grey-bg">
 
  <div class="govuk-grid-column-full">
    <h1 class="govuk-heading-l">
      Task details
    </h1>
    <div class="govuk-form-group case-section-container">
      <fieldset class="govuk-fieldset">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
          
        </legend>
        <div class="govuk-form-group">
          <label class="govuk-label" for="location">
            Choose task type
          </label>
          <div id="location-hint" class="govuk-hint">
            Select from the list below
          </div>
          <select class="govuk-select" id="location" name="location" aria-describedby="location-hint">
            <option value="choose" selected>Choose location</option>
            <option value="eastmidlands">East Midlands</option>
            <option value="eastofengland">East of England</option>
            <option value="london">London</option>
            <option value="northeast">North East</option>
            <option value="northwest">North West</option>
            <option value="southeast">South East</option>
            <option value="southwest">South West</option>
            <option value="westmidlands">West Midlands</option>
            <option value="yorkshire">Yorkshire and the Humber</option>
          </select>
        </div>
        <div class="govuk-form-group">
          <fieldset class="govuk-fieldset" role="group" aria-describedby="passport-issued-hint">
            <legend class="govuk-fieldset__legend ">
              Due date
            </legend>
            <div id="passport-issued-hint" class="govuk-hint">
              For example, 27 3 2007
            </div>
            <div class="govuk-date-input" id="passport-issued">
              <div class="govuk-date-input__item">
                <div class="govuk-form-group">
                  <label class="govuk-label govuk-date-input__label" for="passport-issued-day">
                    Day
                  </label>
                  <input class="govuk-input govuk-date-input__input govuk-input--width-2" id="passport-issued-day" name="passport-issued-day" type="text" inputmode="numeric">
                </div>
              </div>
              <div class="govuk-date-input__item">
                <div class="govuk-form-group">
                  <label class="govuk-label govuk-date-input__label" for="passport-issued-month">
                    Month
                  </label>
                  <input class="govuk-input govuk-date-input__input govuk-input--width-2" id="passport-issued-month" name="passport-issued-month" type="text" inputmode="numeric">
                </div>
              </div>
              <div class="govuk-date-input__item">
                <div class="govuk-form-group">
                  <label class="govuk-label govuk-date-input__label" for="passport-issued-year">
                    Year
                  </label>
                  <input class="govuk-input govuk-date-input__input govuk-input--width-4" id="passport-issued-year" name="passport-issued-year" type="text" inputmode="numeric">
                </div>
              </div>
            </div>
          </fieldset>
        </div>
      </fieldset>
      <div class="govuk-form-group govuk-!-static-margin-top-6">
        <label class="govuk-label" for="more-detail">
          Add a note (optional)
        </label>
        <textarea class="govuk-textarea govuk-!-width-two-thirds" id="more-detail" name="moreDetail" rows="5"></textarea>
      </div>
      <div class="govuk-form-group">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--s">
            
              Who will complete this task ?
           
          </legend>
          <div class="govuk-radios" data-module="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="whereDoYouLive" name="whereDoYouLive" type="radio" value="england">
              <label class="govuk-label govuk-radios__label" for="whereDoYouLive">
                Me
              </label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="whereDoYouLive" name="whereDoYouLive" type="radio" value="england">
              <label class="govuk-label govuk-radios__label" for="whereDoYouLive">
                Someone else
              </label>
            </div>
          </div>
        </fieldset>
      </div>
      <div class="">
        <a href="create-task-what-do-you-need-to-do" class="govuk-button govuk-button--secondary" data-module="govuk-button" data-govuk-button-init="">
          Create task
        </a>
      </div>
    </div>



 

{% endblock %}
