{% extends "layouts/mmw-case.html" %}

{% set pageName="Home" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
<!-- {% include "govuk-prototype-kit/includes/homepage-top.njk" %} -->

    <div>
      <div class="govuk-form-group govuk-character-count" data-module="govuk-character-count" data-maxlength="1000">
        <h1 class="govuk-label-wrapper">
          <label class="govuk-label govuk-label--l" for="with-hint">
            Add note
          </label>
        </h1>
        <div id="with-hint-hint" class="govuk-hint">
          explainer about how to use the feature think about what to include and what not to include in a note.
        </div>
        <textarea class="govuk-textarea govuk-js-character-count" id="with-hint" name="withHint" rows="5" aria-describedby="with-hint-info with-hint-hint"></textarea>
        <div id="with-hint-info" class="govuk-hint govuk-character-count__message">
          You can enter up to 1000 characters
        </div>
      </div>
      <div class="govuk-button-group">
        <a class="govuk-button" href="review-task">
          Continue
        </a>
        <a class="govuk-button govuk-button--secondary" href="case-details">
          Cancel
        </a>
      </div>
    </div>
    

    <!-- {% include "govuk-prototype-kit/includes/homepage-bottom.njk" %} -->
  </div>
  
</div>

{% endblock %}
