{% extends "layouts/mmw-case.html" %}

{% set pageName="Home" %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
<!-- {% include "govuk-prototype-kit/includes/homepage-top.njk" %} -->

    <div class="moj-search">
      <div>
        <div class="govuk-form-group">
          <h1 class="govuk-label-wrapper">
            <label class="govuk-label govuk-label--l" for="event-name">
              Create a task
            </label>
          </h1>
          <div class="govuk-form-group govuk-!-margin-bottom-6">
            <label class="govuk-label" for="location">
              Select a task type
            </label>
            <div id="location-hint" class="govuk-hint">
              Select one
            </div>
            <select class="govuk-select" id="sort" name="sort">
              <option value="published">Recently published</option>
              <option value="updated" selected>Recently updated</option>
              <option value="views">Most views</option>
              <option value="comments">Most comments</option>
            </select>
          </div>
       
        </div>
      </div>
      <div class="govuk-button-group">
        <a class="govuk-button" href="review-task">
          Continue
        </a>
        <a class="govuk-button govuk-button--secondary" href="case-details">
          Cancel
        </a>
      </div>
    </div>
    

    <!-- {% include "govuk-prototype-kit/includes/homepage-bottom.njk" %} -->
  </div>
  
</div>

{% endblock %}
